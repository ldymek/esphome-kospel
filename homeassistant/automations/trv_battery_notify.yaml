# TRV battery push notification (Fibaro FGT-001: use the *_battery_level_1 sensors; the root value never refreshes)
# Replace notify.mobile_app_luke_iphone with your phone's notify service (notify.mobile_app_<device>).
alias: TRV — bateria do ładowania
description: 'Fibaro Heat Controller: powiadomienie push, gdy bateria (endpoint 1 — wartość z roota nigdy się nie
  odświeża) spadnie poniżej 25% na 30 min, plus codzienne przypomnienie o 18:00, dopóki któraś głowica jest poniżej
  progu.'
triggers:
- trigger: numeric_state
  entity_id:
  - sensor.glowica_sypialnia_battery_level_1
  - sensor.glowica_balkon_battery_level_1
  - sensor.glowica_homeoffice_battery_level_1
  - sensor.glowica_kuchnia_battery_level_1
  - sensor.glowica_velux_battery_level_1
  - sensor.glowica_wykusz_battery_level_1
  below: 25
  for:
    minutes: 30
- trigger: time
  at: '18:00:00'
conditions:
- condition: template
  value_template: '{{ niskie | length > 0 }}'
actions:
- action: notify.mobile_app_luke_iphone
  data:
    title: Głowice TRV — naładuj baterię
    message: 'Poniżej {{ prog }}%: {{ niskie }}. Podłącz micro-USB na kilka godzin.'
    data:
      tag: trv_bateria
      group: kociol
      url: /lovelace-grzejniki/grzejniki
- action: persistent_notification.create
  data:
    notification_id: trv_bateria
    title: Głowice TRV — naładuj baterię
    message: 'Poniżej {{ prog }}%: {{ niskie }}'
mode: single
variables:
  prog: 25
  glowice:
    sensor.glowica_sypialnia_battery_level_1: Sypialnia
    sensor.glowica_balkon_battery_level_1: Balkon
    sensor.glowica_homeoffice_battery_level_1: Home office
    sensor.glowica_kuchnia_battery_level_1: Kuchnia
    sensor.glowica_velux_battery_level_1: Velux
    sensor.glowica_wykusz_battery_level_1: Wykusz
  niskie: '{% set ns = namespace(l=[]) %}{% for e, n in glowice.items() %}{% set v = states(e) | float(100) %}{%
    if v < prog %}{% set ns.l = ns.l + [n ~ '' '' ~ (v | int) ~ ''%''] %}{% endif %}{% endfor %}{{ ns.l | join('',
    '') }}'
